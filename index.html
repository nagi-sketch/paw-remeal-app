<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RE:MEAL by the Paw</title>
<script>
/* 設定：キズナが入れる2つ（手順書の③で受け取る）。秘密ではない。ここ以外は触らない */
window.PAW = {
  liffId: '',   // LINE Developers の LIFF ID（例 2001234567-AbCdEfGh）
  api: ''       // Apps Script をウェブアプリとして公開したURL（https://script.google.com/macros/s/…/exec）
};
</script>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 2026-11-25 第1版（12/1 の最低限）。色と字は RE:MEAL のブランド。黒い背景は使わない */
:root{
  --bg:#FAFAF7; --paper:#FFFFFF; --ink:#3B3532; --sub:#8E8781; --line:#E0DAD1; --pri:#5A514D; --soft:#F2EFE9;
  --alert:#9C5B4C; --alertbg:#F6EDE9;
  --font:"Jost","Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere;line-break:strict;-webkit-text-size-adjust:100%}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 0;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:baseline;gap:8px;height:30px}
.logo svg{height:17px;width:auto;display:block}
.logo span{font-size:.72rem;color:var(--sub);letter-spacing:.08em}
.tabs{display:flex;gap:22px;margin-top:4px}
.tabs button{font:inherit;font-size:.92rem;border:0;background:none;color:var(--sub);padding:8px 0 9px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--pri);font-weight:500}
main{flex:1;padding:16px 16px calc(100px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{margin:0 0 10px;font-size:.86rem;font-weight:500;color:var(--sub);letter-spacing:.06em}
.card p{margin:0}
.small{font-size:.8rem;color:var(--sub)}
.date{font-size:1.6rem;font-weight:400;letter-spacing:.02em;line-height:1.2}
.date small{font-size:.9rem;color:var(--sub);margin-left:4px}
.big{font-size:32px;font-weight:400;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.big small{font-size:15px;color:var(--sub);margin-left:4px}
.done3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.done3 div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;font-size:.8rem;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:4px}
.done3 b{font-weight:500;color:var(--ink);font-size:.95rem}
.dot{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:transparent}
.dot.on{background:var(--pri);border-color:var(--pri);color:#fff}
.svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.row{display:flex;gap:8px;align-items:center}
input[type=text],input[type=date],input[type=number],select{font:inherit;font-size:16px;width:100%;height:48px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat}
.kg{display:flex;align-items:center;gap:8px}
.kg input{font-size:22px;text-align:right;max-width:150px}
.btn{font:inherit;font-size:.92rem;height:48px;padding:0 18px;border-radius:10px;border:1px solid var(--pri);background:var(--paper);color:var(--pri);cursor:pointer;white-space:nowrap}
.btn.fill{background:var(--pri);color:#fff}
.btn.sm{height:36px;font-size:.82rem;padding:0 12px}
.btn.link{border:0;height:auto;padding:4px 0;color:var(--sub);text-decoration:underline;font-size:.82rem;background:none}
.btn:disabled{opacity:.45}
.seg{display:grid;gap:6px}
.seg.c2{grid-template-columns:1fr 1fr} .seg.c3{grid-template-columns:repeat(3,1fr)} .seg.c4{grid-template-columns:repeat(4,1fr)}
.seg button{font:inherit;font-size:.92rem;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:#fff}
.pick{width:100%;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:170px;border:1.5px dashed var(--line);border-radius:12px;background:var(--soft);color:var(--sub);font-size:.86rem;cursor:pointer;overflow:hidden;position:relative;margin-top:10px}
.pick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pick .svg{width:28px;height:28px;stroke-width:1.5}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.thumbs.c3{grid-template-columns:repeat(3,1fr)}
.th{position:relative;aspect-ratio:1;border-radius:8px;background:var(--soft);overflow:hidden;border:0;padding:0;cursor:pointer}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th span{position:absolute;left:4px;bottom:4px;background:rgba(250,250,247,.92);color:var(--ink);font-size:.7rem;padding:0 6px;border-radius:6px;line-height:1.6}
.memo{font-size:.84rem;margin-top:8px;display:flex;flex-direction:column;gap:2px}
.memo b{font-weight:500;margin-right:6px}
.note{background:var(--soft);border-radius:10px;padding:12px;font-size:.88rem;margin-top:10px}
.note.alert{background:var(--alertbg);color:var(--ink);border-left:3px solid var(--alert)}
.tag{display:inline-block;font-size:.74rem;padding:1px 9px;border-radius:999px;border:1px solid var(--line);color:var(--sub);white-space:nowrap;line-height:1.7}
.tag.alert{border-color:var(--alert);color:var(--alert);background:var(--alertbg)}
.tag.on{border-color:var(--pri);color:var(--pri)}
.f{display:flex;flex-direction:column;gap:6px;font-size:.86rem;color:var(--sub)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;padding:4px 0;color:var(--ink)}
.check input{width:22px;height:22px;accent-color:var(--pri);flex:none;margin-top:2px}
.consent{font-size:.84rem;background:var(--soft);border-radius:10px;padding:10px 12px}
.consent ol{margin:6px 0 0;padding-left:1.3em}
.consent li{margin-bottom:4px}
.cta{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(250,250,247,.96);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.cta button{display:block;width:100%;max-width:488px;margin:0 auto;height:56px;border:0;border-radius:12px;background:var(--pri);color:#fff;font:inherit;font-size:1rem;font-weight:500;letter-spacing:.04em;cursor:pointer}
.cta button:disabled{opacity:.5}
.chart{position:relative;margin-top:8px}
.chart svg{width:100%;height:auto;display:block;touch-action:pan-y}
.tip{position:absolute;top:0;transform:translateX(-50%);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:.76rem;white-space:nowrap;pointer-events:none}
.day{font-size:.9rem;font-weight:500;margin:4px 0 8px}
.person{display:flex;flex-direction:column;gap:10px}
.person.hard{border-color:var(--alert);border-width:1.5px}
.ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ph b{font-size:1.05rem;font-weight:500}
.ph .r{margin-left:auto}
.status{display:flex;align-items:center;gap:10px;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px}
.status .s{font-size:.86rem}
details summary{font-size:.8rem;color:var(--sub);cursor:pointer}
.err{background:var(--alertbg);border-radius:10px;padding:12px;font-size:.88rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--paper);color:var(--ink);border:1px solid var(--line);box-shadow:0 6px 20px -10px rgba(59,53,50,.45);padding:10px 16px;border-radius:12px;font-size:.88rem;z-index:30;max-width:90vw}
.viewer{position:fixed;inset:0;z-index:40;background:rgba(250,250,247,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px}
.viewer img{max-width:100%;max-height:78vh;border-radius:10px}
.center{text-align:center}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
</style>
</head>
<body>
<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
<symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
</svg>
<div class="app">
  <div class="top">
    <div class="logo"><svg viewBox="0 0 565 120" role="img" aria-label="RE:MEAL"><g transform="translate(10,10)" fill="none" stroke="#3B3532" stroke-width="7" stroke-linejoin="miter" stroke-miterlimit="12"><path d="M0,100 V0 H34 A25,25 0 0 1 34,50 H0 M28,50 L62,100"/><path transform="translate(92,0)" d="M50,0 H0 V100 H50 M0,50 H42"/><path transform="translate(211,0)" d="M0,100 V9.41 L38,74 L76,9.41 V100"/><path transform="translate(317,0)" d="M50,0 H0 V100 H50 M0,50 H42"/><path transform="translate(397,0)" d="M0,100 L35,6.08 L70,100 M13,64 H57"/><path transform="translate(497,0)" d="M0,0 V100 H48"/></g><rect x="182" y="34" width="9" height="9" fill="#3B3532"/><rect x="182" y="101" width="9" height="9" fill="#3B3532"/></svg><span>by the Paw</span></div>
    <nav class="tabs" id="tabs" hidden></nav>
  </div>
  <main id="main"><div class="card center small">読み込んでいます…</div></main>
</div>
<div class="cta" id="cta" hidden><button type="button" id="ctaBtn"></button></div>
<input type="file" id="file" accept="image/*" hidden>
<div class="toast" id="toast" hidden></div>
<div class="viewer" id="viewer" hidden></div>

<script>
(function(){
'use strict';
var S = { token:'', me:null, home:null, screen:'today', meal:'', pickBig:'', pickThumb:'', staffDate:'' };
var MEAL = { b:'朝', l:'昼', d:'夜', s:'間食' };
var MOOD = { good:'よい', ok:'ふつう', hard:'つらい' };
var WD = '日月火水木金土';
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
// 文の「|」を文節の区切り（<wbr>）にする。お客様の入れた文字には使わない
function w(s){ return String(s).split('|').join('<wbr>'); }
function ic(n){ return '<svg class="svg"><use href="#i-'+n+'"/></svg>'; }
function toast(t){ var e=$('toast'); e.textContent=t; e.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(function(){e.hidden=true;},2600); }
function ymdParts(s){ var p=String(s).slice(0,10).split('-'); return { y:+p[0], m:+p[1], d:+p[2], wd:new Date(Date.UTC(+p[0],+p[1]-1,+p[2])).getUTCDay() }; }
function md(s){ var p=ymdParts(s); return p.m+'/'+p.d; }
function mdw(s){ var p=ymdParts(s); return p.m+'/'+p.d+'（'+WD.charAt(p.wd)+'）'; }
function hm(iso){ return iso ? iso.slice(11,16).replace(/^0/,'') : ''; }
function todayStr(){ var d=new Date(Date.now()+9*3600e3); return d.toISOString().slice(0,10); }

/* ---------- 通信 ---------- */
var TEST = /^http:\/\/localhost/.test(PAW.api) && /[?&]t=/.test(location.search);
function api(a, body){
  var payload = Object.assign({ a:a, t:S.token }, body||{});
  return fetch(PAW.api, { method:'POST', body: JSON.stringify(payload) }).then(function(r){ return r.json(); }).then(function(res){
    if (res && res.relogin && window.liff && !TEST) { try { liff.login({ redirectUri: location.href }); } catch(e){} }
    return res;
  }).catch(function(){ return { ok:false, error:'つながりませんでした。電波の良いところでもう一度お試しください' }; });
}
function start(){
  if (!PAW.api) { $('main').innerHTML='<div class="err">設定が入っていません（手順書の③）。</div>'; return; }
  if (TEST) { S.token = decodeURIComponent(location.search.match(/[?&]t=([^&]+)/)[1]); return boot(); }
  if (!window.liff || !PAW.liffId) { $('main').innerHTML='<div class="err">LINEの中で開いてください。</div>'; return; }
  liff.init({ liffId: PAW.liffId }).then(function(){
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    S.token = liff.getIDToken();
    boot();
  }).catch(function(){ $('main').innerHTML='<div class="err">LINEとつながりませんでした。開き直してください。</div>'; });
}
function boot(){
  api('me').then(function(r){
    if (!r.ok) { $('main').innerHTML='<div class="err">'+esc(r.error)+'</div>'; return; }
    S.me = r;
    var wantStaff = location.hash==='#staff' || /[?&]staff=1/.test(location.search);
    if (wantStaff && !r.staff) return renderNotStaff(r.userId);
    if (wantStaff || (!r.registered && r.staff)) return go('staff');
    if (!r.registered) return renderRegister();
    S.home = r.home;
    if (r.needConsent) return renderConsentAgain();
    go('today');
  });
}

/* ---------- 枠 ---------- */
function frame(){
  var items = [];
  if (S.home) items.push(['today','今日'],['record','記録']);
  if (S.me && S.me.staff) items.push(['staff','コーチ']);
  $('tabs').hidden = items.length < 2;
  $('tabs').innerHTML = items.map(function(i){ return '<button type="button" data-go="'+i[0]+'"'+(S.screen===i[0]?' aria-current="page"':'')+'>'+i[1]+'</button>'; }).join('');
}
function go(s){ S.screen=s; frame(); window.scrollTo(0,0); ({ today:renderToday, record:renderRecord, staff:renderStaff })[s](); }
function cta(label, fn, disabled){
  if (!label) { $('cta').hidden=true; return; }
  $('cta').hidden=false; var b=$('ctaBtn'); b.textContent=label; b.disabled=!!disabled; b.onclick=fn;
}

/* ---------- 登録 ---------- */
var CONSENT = '<b>写真と記録の扱い（2026-12 第1版）</b><ol>'+
  '<li>'+w('送っていただいた|食事の写真・体重・体調・一言メモは、|担当の|コーチ（Paw本部の|スタッフ）が|食事の|サポートの|ために|見ます。')+'</li>'+
  '<li>'+w('写真は|会社の|Googleドライブに|保存し、|ほかの|お客様や|社外の|人には|見せません。|顔や|お名前が|写らないように|撮ってください。')+'</li>'+
  '<li>'+w('預かるのは|ニックネームと|LINEの|利用者IDまでです。|お名前・住所・電話番号は|預かりません。')+'</li>'+
  '<li>'+w('プログラムの|終了日から|60日たつと、|写真と|記録を|消します。|早く|消したいときは、|LINEの|トークで|お知らせください。')+'</li>'+
  '<li>'+w('このサービスは|医療では|ありません。|体調が|すぐれないときは、|医療機関に|ご相談ください。')+'</li></ol>';
function renderRegister(){
  S.screen='register'; frame();
  var st=S.me.stores, paw='';
  $('main').innerHTML =
   '<div class="card"><div class="date" style="font-size:1.3rem">'+w('はじめまして')+'</div><p class="small" style="margin-top:4px">'+w('1分で|登録できます。')+'</p></div>'+
   '<div class="card" style="display:flex;flex-direction:column;gap:14px">'+
   '<label class="f">ニックネーム（コーチが見ます）<input type="text" id="r-nick" maxlength="20" autocomplete="nickname"></label>'+
   '<div class="f">Pawの会員ですか<div class="seg c2" id="r-paw"><button type="button" data-v="yes" aria-pressed="false">はい</button><button type="button" data-v="no" aria-pressed="false">いいえ</button></div></div>'+
   '<label class="f">通う店舗<select id="r-store"><option value="" selected disabled>選んでください</option>'+Object.keys(st).map(function(k){return '<option value="'+k+'">'+esc(st[k])+'</option>';}).join('')+'</select></label>'+
   '<label class="f">開始日<input type="date" id="r-start" value="'+todayStr()+'"></label>'+
   '</div>'+
   '<div class="card"><h2>写真と記録の扱い</h2><div class="consent">'+CONSENT+'</div><label class="check" style="margin-top:10px"><input type="checkbox" id="r-consent"><span>読んで同意します</span></label></div>'+
   '<div id="r-err"></div>';
  $('r-paw').onclick=function(e){ var b=e.target.closest('[data-v]'); if(!b) return; paw=b.dataset.v; this.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b);}); };
  cta('はじめる', function(){
    var btn=$('ctaBtn'); btn.disabled=true;
    api('register',{ nick:$('r-nick').value, paw:paw, store:$('r-store').value, start:$('r-start').value, consent:$('r-consent').checked }).then(function(r){
      btn.disabled=false;
      if(!r.ok){ $('r-err').innerHTML='<div class="err">'+esc(r.error)+'</div>'; return; }
      S.home=r.home; S.me.registered=true; renderWelcome();
    });
  });
}
function renderWelcome(){
  S.screen='welcome'; frame();
  $('main').innerHTML='<div class="card"><div class="date" style="font-size:1.3rem">'+w('登録しました')+'</div>'+
    '<p style="margin-top:8px">'+w('このあと、|LINEの|トークに|「登録しました」と|送ってください。|コーチが|あなたを|見つけて、|トークで|お返事します。')+'</p>'+
    '<button type="button" class="btn" id="w-send" style="margin-top:12px">トークに「登録しました」と送る</button></div>';
  $('w-send').onclick=function(){
    var text='RE:MEAL に登録しました（ニックネーム：'+S.home.nick+'）';
    if (TEST || !window.liff || !liff.isInClient || !liff.isInClient()) { toast('トークに送りました（試験）'); return; }
    liff.sendMessages([{ type:'text', text:text }]).then(function(){ toast('トークに送りました'); })
      .catch(function(){ toast('送れませんでした。トークに直接お書きください'); });
  };
  cta('今日の記録へ', function(){ go('today'); });
}
function renderConsentAgain(){
  S.screen='consent'; frame();
  $('main').innerHTML='<div class="card"><h2>'+w('写真と記録の扱いが|新しくなりました')+'</h2><div class="consent">'+CONSENT+'</div><label class="check" style="margin-top:10px"><input type="checkbox" id="c-ok"><span>読んで同意します</span></label></div>';
  cta('続ける', function(){ if(!$('c-ok').checked) return toast('同意にチェックを入れてください'); api('consent').then(function(){ go('today'); }); });
}
function renderNotStaff(uid){
  S.screen='notstaff'; frame(); cta('');
  $('main').innerHTML='<div class="card"><h2>コーチ画面</h2><p>'+w('まだ|スタッフとして|登録されていません。|下の|IDを|本部に|送ってください。')+'</p><p style="margin-top:10px;font-weight:500;user-select:all;word-break:break-all;font-size:.9rem">'+esc(uid||'')+'</p></div>';
}

/* ---------- 今日 ---------- */
function defaultMeal(){ var h=new Date(Date.now()+9*3600e3).getUTCHours(); return h<10?'b':h<15?'l':h<17?'s':'d'; }
function renderToday(){
  var t=S.home.today;
  if (!S.meal) S.meal=defaultMeal();
  var n=t.photos.length;
  var html='<div><div class="date">'+md(t.date)+'<small>'+WD.charAt(ymdParts(t.date).wd)+'曜日</small></div></div>'+
    '<div class="done3">'+
      '<div><span class="dot'+(t.kg!=null?' on':'')+'">'+ic('check')+'</span>朝の体重<b>'+(t.kg!=null?'済':'未')+'</b></div>'+
      '<div><span class="dot'+(n?' on':'')+'">'+ic('check')+'</span>食事の写真<b>'+n+'枚</b></div>'+
      '<div><span class="dot'+(t.mood?' on':'')+'">'+ic('check')+'</span>夜の体調<b>'+(t.mood?'済':'未')+'</b></div>'+
    '</div>';
  // 朝の体重：数字に評価や色をつけない
  html+='<div class="card"><h2>朝の体重</h2>'+(t.kg!=null
    ? '<div class="row" style="justify-content:space-between"><div class="big">'+t.kg.toFixed(1)+'<small>kg</small></div><button type="button" class="btn link" id="kg-edit">入れ直す</button></div>'
    : kgForm())+'</div>';
  // 食事の写真
  html+='<div class="card"><h2>食事の写真</h2><div class="seg c4" id="meal">'+Object.keys(MEAL).map(function(k){ return '<button type="button" data-meal="'+k+'" aria-pressed="'+(S.meal===k)+'">'+MEAL[k]+'</button>'; }).join('')+'</div>'+
    '<button type="button" class="pick" id="pick">'+(S.pickThumb?'<img src="'+S.pickThumb+'" alt="選んだ写真">':ic('camera')+'<span>タップして撮る・選ぶ</span>')+'</button>'+
    '<input type="text" id="ph-memo" maxlength="100" placeholder="一言（例：鮭定食・外食）任意" style="margin-top:10px">'+
    (n?'<p class="small" style="margin:12px 0 6px">今日送った写真</p><div class="thumbs">'+t.photos.map(thumbHtml).join('')+'</div>':'')+'</div>';
  // 夜の体調
  html+='<div class="card"><h2>夜の体調</h2><div class="seg c3" id="mood">'+Object.keys(MOOD).map(function(k){ return '<button type="button" data-mood="'+k+'" aria-pressed="'+(t.mood===k)+'">'+MOOD[k]+'</button>'; }).join('')+'</div>'+
    (t.mood==='hard'?hardNote():'')+'</div>';
  $('main').innerHTML=html;
  if ($('kg-go')) $('kg-go').onclick=saveKg;
  if ($('kg-edit')) $('kg-edit').onclick=function(){ this.parentNode.outerHTML=kgForm(t.kg); $('kg-go').onclick=saveKg; };
  $('meal').onclick=function(e){ var b=e.target.closest('[data-meal]'); if(!b) return; S.meal=b.dataset.meal; this.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b);}); };
  $('pick').onclick=function(){ $('file').click(); };
  $('mood').onclick=function(e){ var b=e.target.closest('[data-mood]'); if(!b) return;
    api('mood',{mood:b.dataset.mood}).then(function(r){ if(!r.ok) return toast(r.error); S.home.today=r.today; toast('記録しました'); renderToday(); }); };
  loadThumbs();
  setPhotoCta();
}
function kgForm(v){ return '<div class="kg"><input type="number" id="kg" inputmode="decimal" step="0.1" min="25" max="200" placeholder="00.0" value="'+(v!=null?v.toFixed(1):'')+'" aria-label="体重（kg）"><span>kg</span><button type="button" class="btn" id="kg-go" style="margin-left:auto">記録する</button></div><p class="small" style="margin-top:8px">'+w('起きて|お手洗いの|あと、|同じ|タイミングで|測ってください。')+'</p>'; }
function saveKg(){ var b=this; b.disabled=true; api('weight',{kg:$('kg').value}).then(function(r){ b.disabled=false; if(!r.ok) return toast(r.error); S.home.today=r.today; toast('記録しました'); renderToday(); }); }
function hardNote(){ return '<div class="note alert">'+w('つらい|ときは、|無理を|しないで|ください。|強い|痛みや|熱、|いつもと|違う|症状が|あるときや、|つらさが|続くときは、|早めに|医療機関を|受診して|ください。|コーチも|確認します。')+'</div>'; }
function setPhotoCta(){
  if (S.pickBig) cta('この写真を送る', sendPhoto);
  else cta('食事の写真を撮る・選ぶ', function(){ $('file').click(); });
}
$('file').onchange=function(){
  var f=this.files&&this.files[0]; this.value='';
  if(!f) return;
  Promise.all([shrink(f,1280,0.82), shrink(f,320,0.7)]).then(function(r){
    S.pickBig=r[0]; S.pickThumb=r[1];
    if (S.screen==='today'){ $('pick').innerHTML='<img src="'+S.pickThumb+'" alt="選んだ写真">'; setPhotoCta(); }
  }).catch(function(){ toast('写真が読めませんでした。別の写真でお試しください'); });
};
function sendPhoto(){
  var b=$('ctaBtn'); b.disabled=true; b.textContent='送っています…';
  api('photo',{ meal:S.meal, image:S.pickBig, thumb:S.pickThumb, memo:$('ph-memo')?$('ph-memo').value:'' }).then(function(r){
    b.disabled=false;
    if(!r.ok){ setPhotoCta(); return toast(r.error); }
    S.pickBig=''; S.pickThumb=''; S.home.today=r.today; toast(MEAL[S.meal]+'の写真を送りました'); renderToday();
  });
}
// 長辺を max px に縮めて JPEG にする（向きは端末の向きのまま）
function shrink(file, max, q){
  return new Promise(function(ok, ng){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var s=Math.min(1, max/Math.max(img.naturalWidth, img.naturalHeight)), c=document.createElement('canvas');
      c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
      var g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', q));
    };
    img.onerror=function(){ URL.revokeObjectURL(url); ng(); };
    img.src=url;
  });
}

/* ---------- 写真の縮小表示（必要な分だけ読む） ---------- */
var IMG = {};
function thumbHtml(p){ return '<button type="button" class="th" data-photo="'+esc(p.id)+'"><img data-img="'+esc(p.id)+'" alt="'+esc(MEAL[p.meal]||'')+'の写真"'+(IMG[p.id]?' src="'+IMG[p.id]+'"':'')+'><span>'+esc(MEAL[p.meal]||'')+'</span></button>'; }
function loadThumbs(){
  var need=[].slice.call(document.querySelectorAll('img[data-img]')).map(function(i){ return i.dataset.img; }).filter(function(id){ return !IMG[id]; });
  for (var i=0;i<need.length;i+=12) (function(ids){
    api('img',{ ids:ids, size:'thumb' }).then(function(r){
      if(!r.ok) return;
      Object.keys(r.images).forEach(function(id){ IMG[id]=r.images[id]; document.querySelectorAll('img[data-img="'+id+'"]').forEach(function(el){ el.src=r.images[id]; }); });
    });
  })(need.slice(i,i+12));
}
function openPhoto(id){
  var v=$('viewer');
  v.innerHTML='<img alt="写真" src="'+(IMG[id]||'')+'"><button type="button" class="btn" id="v-close">'+'閉じる</button>'; v.hidden=false;
  $('v-close').onclick=function(){ v.hidden=true; };
  api('img',{ ids:[id], size:'full' }).then(function(r){ if(r.ok&&r.images[id]&&!v.hidden) v.querySelector('img').src=r.images[id]; });
}

/* ---------- 記録 ---------- */
function renderRecord(){
  var main=$('main'); main.innerHTML='<div class="card center small">読み込んでいます…</div>';
  cta('今日の画面へ', function(){ go('today'); });
  api('record').then(function(r){
    if(!r.ok) return main.innerHTML='<div class="err">'+esc(r.error)+'</div>';
    var vals=r.avg.filter(function(p){ return p.v!=null; }), last=vals.length?vals[vals.length-1]:null;
    var html='<div class="card"><h2>体重（7日平均）</h2>'+(last
      ? '<div class="big">'+last.v.toFixed(1)+'<small>kg</small></div><p class="small">'+mdw(last.d)+'までの7日の平均</p>'+chartHtml(r.avg,'ch1')+
        '<p class="small" style="margin-top:8px">'+w('毎日の|数字は|日によって|上下します。|ここでは|7日の|平均だけを|線に|しています。')+'</p>'
      : '<p>'+w('3日分の|記録が|たまると、|線が|出ます。')+'</p>')+'</div>';
    html+='<div class="card"><h2>送った写真</h2>'+(r.photos.length?r.photos.map(function(day){
      return '<div class="day">'+mdw(day.date)+'<span class="small" style="margin-left:8px">'+day.list.length+'枚</span></div><div class="thumbs" style="margin-bottom:14px">'+day.list.map(thumbHtml).join('')+'</div>';
    }).join(''):'<p class="small">まだありません</p>')+'</div>';
    main.innerHTML=html;
    bindChart('ch1', r.avg);
    loadThumbs();
  });
}

/* 7日平均の線。点・毎日の数字・前日比は描かない。タップするとその日の7日平均を出す */
function chartHtml(pts, id, small){
  var W=320, H=small?70:130, L=small?4:34, R=6, T=10, B=small?6:22;
  var vs=pts.filter(function(p){return p.v!=null;}).map(function(p){return p.v;});
  if(!vs.length) return '<p class="small">記録がたまると線が出ます</p>';
  var lo=Math.min.apply(null,vs), hi=Math.max.apply(null,vs), pad=Math.max(0.5,(hi-lo)*0.2); lo-=pad; hi+=pad;
  var x=function(i){ return L+(W-L-R)*(pts.length<2?0.5:i/(pts.length-1)); }, y=function(v){ return T+(H-T-B)*(1-(v-lo)/(hi-lo)); };
  var segs=[], cur=[];
  pts.forEach(function(p,i){ if(p.v==null){ if(cur.length) segs.push(cur); cur=[]; } else cur.push(x(i).toFixed(1)+','+y(p.v).toFixed(1)); });
  if(cur.length) segs.push(cur);
  var s='<svg viewBox="0 0 '+W+' '+H+'" id="'+id+'" role="img" aria-label="体重の7日平均の線">';
  if(!small){
    s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+(H-B)+'" y2="'+(H-B)+'" stroke="#E0DAD1"/>';
    s+='<text x="'+(L-6)+'" y="'+(T+4)+'" font-size="10" fill="#8E8781" text-anchor="end">'+hi.toFixed(1)+'</text><text x="'+(L-6)+'" y="'+(H-B)+'" font-size="10" fill="#8E8781" text-anchor="end">'+lo.toFixed(1)+'</text>';
    s+='<text x="'+L+'" y="'+(H-6)+'" font-size="10" fill="#8E8781">'+md(pts[0].d)+'</text><text x="'+(W-R)+'" y="'+(H-6)+'" font-size="10" fill="#8E8781" text-anchor="end">'+md(pts[pts.length-1].d)+'</text>';
    s+='<line class="cross" x1="0" x2="0" y1="'+T+'" y2="'+(H-B)+'" stroke="#8E8781" stroke-dasharray="2 3" visibility="hidden"/>';
  }
  segs.forEach(function(sg){ s+= sg.length>1 ? '<polyline points="'+sg.join(' ')+'" fill="none" stroke="#5A514D" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' : ''; });
  s+='<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="transparent"/></svg>';
  return '<div class="chart">'+s+(small?'':'<div class="tip" hidden></div>')+'</div>';
}
function bindChart(id, pts){
  var svg=$(id); if(!svg) return;
  var box=svg.parentNode, tip=box.querySelector('.tip'), cross=svg.querySelector('.cross'), W=320, L=34, R=6;
  function at(e){
    var rc=svg.getBoundingClientRect(), cx=((e.touches?e.touches[0].clientX:e.clientX)-rc.left)*W/rc.width;
    var i=Math.round((cx-L)/(W-L-R)*(pts.length-1)); i=Math.max(0,Math.min(pts.length-1,i));
    if(pts[i].v==null){ tip.hidden=true; cross.setAttribute('visibility','hidden'); return; }
    var px=L+(W-L-R)*i/(pts.length-1); cross.setAttribute('x1',px); cross.setAttribute('x2',px); cross.setAttribute('visibility','visible');
    tip.hidden=false; tip.textContent=mdw(pts[i].d)+' 7日平均 '+pts[i].v.toFixed(1)+'kg'; tip.style.left=Math.max(60,Math.min(rc.width-60,px*rc.width/W))+'px';
  }
  svg.addEventListener('pointermove',at); svg.addEventListener('pointerdown',at);
  svg.addEventListener('pointerleave',function(){ tip.hidden=true; cross.setAttribute('visibility','hidden'); });
}

/* ---------- コーチ画面 ---------- */
function renderStaff(){
  var main=$('main'); main.innerHTML='<div class="card center small">読み込んでいます…</div>';
  cta('最新にする', function(){ renderStaff(); });
  api('staffHome',{ date:S.staffDate }).then(function(r){
    if(!r.ok){ if(r.userId) return renderNotStaff(r.userId); main.innerHTML='<div class="err">'+esc(r.error)+'</div>'; return; }
    var isY=r.date!==r.today, total=r.people.length;
    var html='<div class="card"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><h2 style="margin:0">コーチ画面</h2><div class="small">'+esc(r.me.name)+'さん</div></div>'+
      '<div class="seg c2" id="sd" style="min-width:170px"><button type="button" data-d="" aria-pressed="'+isY+'">前日 '+(isY?md(r.date):md(addDay(r.today,-1)))+'</button><button type="button" data-d="'+r.today+'" aria-pressed="'+(!isY)+'">今日 '+md(r.today)+'</button></div></div>'+
      '<div class="row" style="margin-top:12px;align-items:baseline;gap:6px"><span class="small">返信</span><span class="big">'+r.done+'</span><span class="small">／ '+total+'人</span></div>'+
      '<p class="small">'+w('期限は|'+mdw(r.deadline)+'|'+hm(r.deadline)+'。|返信は|LINE公式アカウントの|チャットから|送り、|送ったら|「返信した」を|押してください。')+'</p>'+
      (r.late&&r.done<total?'<div class="note alert">'+w('期限を|過ぎています。|未返信の|方から|先に|返してください。')+'</div>':'')+'</div>';
    if (r.hardToday.length) html+='<div class="card person hard"><h2 style="margin:0;color:var(--alert)">今日「つらい」を選んだ方</h2><p>'+r.hardToday.map(function(h){ return '<b>'+esc(h.nick)+'</b>さん <span class="small">'+hm(h.at)+'</span>'; }).join('　')+'</p><p class="small">'+w('今日の|分を|開いて、|早めに|声を|かけてください。')+'</p></div>';
    html+= r.people.length ? r.people.map(personHtml).join('') : '<div class="card small center">この日の記録はありません</div>';
    if (r.quiet.length) html+='<div class="card"><h2>記録がなかった方</h2><p class="small">'+r.quiet.map(esc).join('、')+'</p></div>';
    main.innerHTML=html;
    $('sd').onclick=function(e){ var b=e.target.closest('[data-d]'); if(!b) return; S.staffDate=b.dataset.d; renderStaff(); };
    r.people.forEach(function(p){ bindChart('sp-'+p.userId, p.avg); });
    main.onclick=function(e){
      var x=e.target.closest('[data-reply]'); if(x){ x.disabled=true; return api('replied',{ userId:x.dataset.reply, date:r.date }).then(function(q){ if(!q.ok){ x.disabled=false; return toast(q.error); } toast('返信した時刻を残しました'); renderStaff(); }); }
      x=e.target.closest('[data-undo]'); if(x) return api('replied',{ userId:x.dataset.undo, date:r.date, undo:true }).then(function(){ renderStaff(); });
      x=e.target.closest('[data-end]'); if(x){ var inp=$('end-'+x.dataset.end); return api('setEnd',{ userId:x.dataset.end, end:inp.value }).then(function(q){ toast(q.ok?'終了日を保存しました':q.error); }); }
    };
    loadThumbs();
  });
}
function personHtml(p){
  var mood=p.mood?'<span class="tag'+(p.mood==='hard'?' alert':'')+'">体調 '+MOOD[p.mood]+'</span>':'<span class="tag">体調 未</span>';
  var vals=p.avg.filter(function(a){return a.v!=null;}), last=vals.length?vals[vals.length-1]:null;
  var memos=p.photos.filter(function(x){return x.memo;});
  var st=p.reply
    ? '<span class="s"><span class="tag on">済</span> '+hm(p.reply.at)+' '+esc(p.reply.by)+'（'+(p.reply.ontime?'期限内':'期限後')+'）</span><button type="button" class="btn link" data-undo="'+esc(p.userId)+'">取り消す</button>'
    : '<span class="s"><span class="tag">未</span></span><button type="button" class="btn fill sm" data-reply="'+esc(p.userId)+'" style="height:44px;padding:0 18px">返信した</button>';
  return '<div class="card person'+(p.mood==='hard'?' hard':'')+'">'+
    '<div class="ph"><b>'+esc(p.nick)+'</b><span class="small">'+esc(p.store)+(p.paw==='はい'?'・Paw会員':'')+'</span><span class="r">'+mood+'</span></div>'+
    (p.mood==='hard'?'<div class="note alert" style="margin:0">'+w('「つらい」を|選んでいます。|受診を|すすめる|文が|画面に|出ています。|様子を|聞いてください。')+'</div>':'')+
    (p.photos.length?'<div class="thumbs c3">'+p.photos.map(thumbHtml).join('')+'</div>':'<p class="small">写真はありません</p>')+
    (memos.length?'<div class="memo">'+memos.map(function(x){ return '<div><b>'+esc(MEAL[x.meal])+'</b>'+esc(x.memo)+'</div>'; }).join('')+'</div>':'')+
    '<div><div class="row" style="justify-content:space-between"><span class="small">体重 7日平均（14日）'+(p.weighed?'':'・この日は記録なし')+'</span><span style="font-size:1.05rem">'+(last?last.v.toFixed(1)+' kg':'—')+'</span></div>'+chartHtml(p.avg,'sp-'+p.userId)+'</div>'+
    '<div class="status">'+st+'</div>'+
    '<details><summary>終了日（'+(p.end?md(p.end):'未設定')+'）</summary><div class="row" style="margin-top:8px"><input type="date" id="end-'+esc(p.userId)+'" value="'+esc(p.end)+'"><button type="button" class="btn sm" data-end="'+esc(p.userId)+'">保存</button></div><p class="small" style="margin-top:4px">'+w('終了日から|60日で|写真と|記録が|消えます。')+'</p></details>'+
    '</div>';
}
function addDay(s,n){ var d=new Date(s+'T12:00:00+09:00'); d=new Date(d.getTime()+n*864e5+9*3600e3); return d.toISOString().slice(0,10); }

/* ---------- 押したときの動き ---------- */
document.addEventListener('click', function(e){
  var g=e.target.closest('[data-go]'); if(g) return go(g.dataset.go);
  var p=e.target.closest('[data-photo]'); if(p) return openPhoto(p.dataset.photo);
});

start();
})();
</script>
